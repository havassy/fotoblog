name: Temporary tag-link regression check (no deployment)

on:
  push:
    branches:
      - fix-nonexistent-tag-links

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify existing archives, missing tag links, and unchanged site functions
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import re, json, xml.etree.ElementTree as ET

          site = Path("_site")
          posts = list(Path("_posts").glob("*.md"))
          images = list(Path("assets/images").glob("*.jpg"))
          pages = list(site.rglob("*.html"))
          assert len(posts) == 173, f"Unexpected post count {len(posts)}"
          assert len(images) == 173, f"Unexpected image count {len(images)}"
          assert len(pages) == 252, f"Unexpected HTML page count {len(pages)}"
          for post in posts:
              m = re.fullmatch(r"(\d{4})-(\d{2})-(\d{2})-(.+)\.md",post.name)
              assert m, post.name
              target = site / m.group(1) / m.group(2) / m.group(3) / (m.group(4)+".html")
              assert target.is_file(), f"Missing post {target}"
          for p in images:
              assert (site / p).is_file(), f"Missing image: {p}"
          for p in ["index.html","archive/index.html","tags/index.html","map/index.html","sitemap.xml","subscription-feed.xml","robots.txt"]:
              assert (site/p).is_file(), f"Missing site output: {p}"
          assert "https://balkaninaplo.hu" in (site/"index.html").read_text()
          assert "https://balkaninaplo.hu/sitemap.xml" in (site/"robots.txt").read_text()
          ET.parse(site/"sitemap.xml")
          feed=ET.parse(site/"subscription-feed.xml").getroot()
          entries=feed.findall("{http://www.w3.org/2005/Atom}entry")
          state=json.loads(Path(".subscription-feed-state.json").read_text())
          assert len(entries)==len(state["entries"])
          assert {e.findtext("{http://www.w3.org/2005/Atom}id") for e in entries}=={x["id"] for x in state["entries"]}

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]
                  self.tags_as_links=0
                  self.tags_as_text=0
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag in ("a","img"):
                      value=d.get("href" if tag=="a" else "src")
                      if value: self.links.append(value)
                  classes=d.get("class","").split()
                  if tag=="a" and ("tag" in classes or "tag-card" in classes): self.tags_as_links+=1
                  if tag in ("span","div") and ("tag" in classes or "tag-card" in classes): self.tags_as_text+=1

          broken=[]
          linked_tags=0
          nonlinked_tags=0
          for page in pages:
              p=Parser()
              p.feed(page.read_text(encoding="utf-8"))
              linked_tags+=p.tags_as_links
              nonlinked_tags+=p.tags_as_text
              for link in p.links:
                  url=urlsplit(link)
                  if url.scheme or url.netloc or not url.path.startswith("/"):continue
                  dest=site/unquote(url.path).lstrip("/")
                  if dest.is_dir():dest=dest/"index.html"
                  if not dest.is_file():broken.append((str(page),link))
          assert not broken, f"Broken internal links: {broken[:25]}"
          assert linked_tags>0, "Existing tag archive links unexpectedly absent"
          assert nonlinked_tags>0, "Unlinked tags unexpectedly absent"
          assert "/tags/vihar/" not in (site/"2011/07/22/fruskagora_villam.html").read_text(), "Missing-tag link still rendered"
          assert "/tags/forras/" in (site/"tags/index.html").read_text(), "Valid tag index link missing"
          print(f"PASS: {len(posts)} posts, {len(images)} images, {len(pages)} HTML pages")
          print(f"PASS: {linked_tags} valid clickable tags, {nonlinked_tags} non-clickable tags")
          print("PASS: all local HTML links, images, sitemap, feed, canonical host, navigation")
          print("No deployment performed")
          PY
